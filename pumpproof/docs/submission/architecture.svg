<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680"><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#326856"/></marker></defs><rect width="1200" height="680" fill="#f5f4ee"/><text x="40" y="55" font-family="Arial" font-size="30" fill="#193740">PumpProof — exact-trace accounting</text><rect x="40" y="110" width="320" height="85" rx="8" fill="#fffefa" stroke="#326856"/><text x="58" y="142" font-family="Arial" font-size="18" fill="#193740">Pinned sources</text><text x="58" y="167" font-family="Arial" font-size="14" fill="#193740">Demand + GB intensity; hash-checked</text><rect x="440" y="110" width="320" height="85" rx="8" fill="#fffefa" stroke="#326856"/><text x="458" y="142" font-family="Arial" font-size="18" fill="#193740">Completed pumping trace</text><text x="458" y="167" font-family="Arial" font-size="14" fill="#193740">External JSON / rule / model replay</text><rect x="840" y="110" width="320" height="85" rx="8" fill="#fffefa" stroke="#326856"/><text x="858" y="142" font-family="Arial" font-size="18" fill="#193740">Exact accounting</text><text x="858" y="167" font-family="Arial" font-size="14" fill="#193740">BigInt litres and carbon scores</text><rect x="840" y="280" width="320" height="85" rx="8" fill="#fffefa" stroke="#326856"/><text x="858" y="312" font-family="Arial" font-size="18" fill="#193740">Operator commitment</text><text x="858" y="337" font-family="Arial" font-size="14" fill="#193740">Versioned descriptor + exact trace</text><rect x="440" y="280" width="320" height="85" rx="8" fill="#fffefa" stroke="#326856"/><text x="458" y="312" font-family="Arial" font-size="18" fill="#193740">Auditor attestation</text><text x="458" y="337" font-family="Arial" font-size="14" fill="#193740">Evidence hash under separate local key</text><rect x="40" y="280" width="320" height="85" rx="8" fill="#fffefa" stroke="#326856"/><text x="58" y="312" font-family="Arial" font-size="18" fill="#193740">Solidity settlement</text><text x="58" y="337" font-family="Arial" font-size="14" fill="#193740">Hourly bounds + terminal equality</text><rect x="40" y="450" width="320" height="85" rx="8" fill="#fffefa" stroke="#326856"/><text x="58" y="482" font-family="Arial" font-size="18" fill="#193740">Signed v3 evidence</text><text x="58" y="507" font-family="Arial" font-size="14" fill="#193740">Accepted receipt OR refused experiment</text><rect x="440" y="450" width="720" height="85" rx="8" fill="#fffefa" stroke="#326856"/><text x="458" y="482" font-family="Arial" font-size="18" fill="#193740">Independent verification</text><text x="458" y="507" font-family="Arial" font-size="14" fill="#193740">Pinned inputs + exact trace + fresh EVM; no optimiser</text><path d="M360 152 H440" fill="none" stroke="#326856" stroke-width="3" marker-end="url(#arrow)"/><path d="M760 152 H840" fill="none" stroke="#326856" stroke-width="3" marker-end="url(#arrow)"/><path d="M1000 195 V280" fill="none" stroke="#326856" stroke-width="3" marker-end="url(#arrow)"/><path d="M840 322 H760" fill="none" stroke="#326856" stroke-width="3" marker-end="url(#arrow)"/><path d="M440 322 H360" fill="none" stroke="#326856" stroke-width="3" marker-end="url(#arrow)"/><path d="M200 365 V450" fill="none" stroke="#326856" stroke-width="3" marker-end="url(#arrow)"/><path d="M360 492 H440" fill="none" stroke="#326856" stroke-width="3" marker-end="url(#arrow)"/><rect x="40" y="580" width="1120" height="65" rx="8" fill="#f0dfca"/><text x="60" y="607" font-family="Arial" font-size="17" fill="#75432f">TRUST BOUNDARY: the contract trusts attested inputs. Both local roles run on one machine.</text><text x="60" y="631" font-family="Arial" font-size="15" fill="#75432f">No proof of physical pumping, independent organisations, timely historical commitment or original chain history.</text></svg>